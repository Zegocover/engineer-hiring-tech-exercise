<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">site-crawler design</title>
  <desc id="desc">Flow from the command line through the queue, HTTP client, and parser. Same-host links return to the queue. Other hosts are printed and not fetched.</desc>
  <rect width="960" height="520" rx="16" fill="#0f1419"/>
  <text x="32" y="42" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">How a crawl moves</text>
  <text x="32" y="66" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">One process. Several pages in flight. Each URL fetched once.</text>

  <rect x="32" y="96" width="170" height="64" rx="10" fill="#1c2430" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="117" y="124" text-anchor="middle" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">cli.py</text>
  <text x="117" y="144" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">URL and flags</text>

  <rect x="250" y="96" width="190" height="64" rx="10" fill="#1c2430" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="345" y="124" text-anchor="middle" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Canonical URL</text>
  <text x="345" y="144" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">exact host only</text>

  <rect x="488" y="96" width="200" height="64" rx="10" fill="#1c2430" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="588" y="124" text-anchor="middle" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Queue + visited set</text>
  <text x="588" y="144" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">each URL once</text>

  <rect x="736" y="96" width="192" height="64" rx="10" fill="#1c2430" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="832" y="124" text-anchor="middle" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Worker pool</text>
  <text x="832" y="144" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">size = concurrency</text>

  <path d="M202 128 H250" stroke="#6b7c93" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M440 128 H488" stroke="#6b7c93" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M688 128 H736" stroke="#6b7c93" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="210" width="360" height="72" rx="10" fill="#16261c" stroke="#3dd68c" stroke-width="1.5"/>
  <text x="480" y="240" text-anchor="middle" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">HttpClient</text>
  <text x="480" y="260" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">one session, capped connections, keep-alive</text>
  <path d="M832 160 V246 H660" stroke="#6b7c93" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="48" y="340" width="250" height="78" rx="10" fill="#2a2114" stroke="#e6b35a" stroke-width="1.5"/>
  <text x="173" y="372" text-anchor="middle" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Record only</text>
  <text x="173" y="394" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">timeout, HTTP error, non-HTML,</text>
  <text x="173" y="410" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">or redirect off this host</text>

  <rect x="355" y="340" width="250" height="78" rx="10" fill="#1c2430" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="480" y="372" text-anchor="middle" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">parser.py</text>
  <text x="480" y="394" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">absolute links on this HTML page</text>

  <rect x="662" y="340" width="250" height="78" rx="10" fill="#16261c" stroke="#3dd68c" stroke-width="1.5"/>
  <text x="787" y="372" text-anchor="middle" fill="#e7ecf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Print, then decide</text>
  <text x="787" y="394" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">same host and unseen: enqueue</text>
  <text x="787" y="410" text-anchor="middle" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">else: printed, not fetched</text>

  <path d="M390 282 V340" stroke="#6b7c93" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M480 282 V340" stroke="#6b7c93" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M605 379 H662" stroke="#6b7c93" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M787 340 V200 H688" stroke="#3dd68c" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>

  <text x="32" y="490" fill="#9aa6b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Green return path: a new same-host URL goes back on the queue.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#6b7c93"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#3dd68c"/>
    </marker>
  </defs>
</svg>
