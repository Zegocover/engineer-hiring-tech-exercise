name: Java crawler

on:
  push:
    paths:
      - "java/**"
      - ".github/workflows/java-crawler.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-crawler.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: ./gradlew --no-daemon build
