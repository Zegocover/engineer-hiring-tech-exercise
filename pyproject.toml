[project]
name = "crawler"
version = "0.1.0"
description = "A fast, single-domain, asynchronous web crawler."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "httpx-retries>=0.6.0",
    "protego>=0.6.2",
    "selectolax>=0.3.21",
]

[project.scripts]
crawler = "crawler.src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["crawler/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
