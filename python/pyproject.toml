[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "site-crawler"
version = "0.1.0"
description = "A fast, single-domain website crawler."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.15.0",
    "httpx[http2]==0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.12.10",
]

[project.scripts]
site-crawler = "site_crawler.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]
