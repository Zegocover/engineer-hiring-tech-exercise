[project]
name = "zego-crawler"
version = "0.1.0"
description = "Single-domain asynchronous web crawler."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "lxml>=5.2", "pydantic-settings>=2.4"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-httpx>=0.30", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "ASYNC", "TID", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
